# Domain-aware vocabulary used by the v0.4 retokenizer.
#
# - `protected_phrases`: multi-word units that the embedder / BM25 indexer
#   should keep as a single token. Without this, "self-driving lab" tokenizes
#   to ["self", "driving", "lab"] and loses precision.
# - `canonical_synonyms`: map synonyms / surface variants onto a canonical
#   concept. Searches for the canonical concept also retrieve the synonym.
# - `negative_phrases`: phrases that LOOK like SDL signals but aren't.
#   The evidence extractor flags these as low-confidence (e.g. "closed-loop
#   control" usually means control theory, not autonomous chemistry).

protected_phrases:
  - self-driving lab
  - self-driving laboratory
  - self-driven lab
  - self-driven laboratory
  - autonomous lab
  - autonomous laboratory
  - autonomous experiment
  - autonomous discovery
  - accelerated discovery
  - accelerated experiment
  - accelerated scientific discovery
  - discovery acceleration
  - materials acceleration platform
  - closed-loop experimentation
  - closed-loop optimization
  - closed-loop
  - Bayesian optimization
  - active learning
  - reinforcement learning
  - Gaussian process
  - data-driven
  - algorithm-guided
  - high-throughput experimentation
  - high throughput experiment
  - high-throughput screening
  - HTE
  - workflow orchestration
  - robotic synthesis
  - robotic platform
  - robotic experiment
  - robotic laboratory
  - robot scientist
  - automated synthesis
  - automated experimentation
  - self-optimizing
  - adaptive optimization
  - experiment planning
  - adaptive experimentation
  - design-build-test-learn
  - DBTL
  - University of Toronto
  - University of British Columbia
  - Vector Institute
  - Acceleration Consortium
  - ChemOS
  - Opentrons
  - BayBE
  - PHYSBO

canonical_synonyms:
  autonomous lab: self-driving laboratory
  autonomous laboratory: self-driving laboratory
  self-driving lab: self-driving laboratory
  self-driven lab: self-driving laboratory
  self-driven laboratory: self-driving laboratory
  self driving lab: self-driving laboratory
  self driving laboratory: self-driving laboratory
  sdl: self-driving laboratory
  robotic experimentation: lab automation
  sequential optimization: Bayesian optimization
  high throughput experiment: high-throughput experimentation
  hte: high-throughput experimentation
  design build test learn: design-build-test-learn
  experiment planning agent: scientific agent
  uoft: University of Toronto
  univ. toronto: University of Toronto
  ubc: University of British Columbia
  ac: Acceleration Consortium

negative_phrases:
  - closed-loop control          # control theory, not SDL
  - feedback control             # control theory
  - factory automation           # industrial, not lab
  - software testing automation  # CI/CD, not lab
  - process control loop         # industrial control
