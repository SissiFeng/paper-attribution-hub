# Typed entity vocabulary for cross-SDL knowledge transfer.
#
# Sections map to PaperEntity.entity_type: methods → method, materials →
# material, instruments → instrument, software → software.
# Each entry has a canonical `name` plus surface-form `aliases`. Matching is
# case-insensitive with word boundaries (see entity_extractor); aliases
# shorter than 3 characters are never matched, so don't bother listing them
# (this is also why ambiguous 2-char acronyms like "GP"/"RF" are absent).
#
# Method entries may carry an optional `category` naming the coarse method
# family the fine-grained term belongs to. Every `category` value must itself
# be the canonical `name` of a method entry (enforced by tests). Coarse
# family entries carry no `category`.
#
# Keep terms consistent with data/domain_vocabulary.yaml and
# data/retrieval_operationalization_terms.yaml.

