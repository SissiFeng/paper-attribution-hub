knowledge_lifecycle:
  states:
    - proposed
    - reviewed
    - validation_requested
    - validated
    - rejected
    - promoted
    - deprecated
  transitions:
    - from: proposed
      action: review
      to: reviewed
    - from: proposed
      action: request_validation
      to: validation_requested
    - from: proposed
      action: reject
      to: rejected
    - from: reviewed
      action: request_validation
      to: validation_requested
    - from: reviewed
      action: reject
      to: rejected
    - from: validation_requested
      action: validate
      to: validated
    - from: validation_requested
      action: reject
      to: rejected
    - from: validated
      action: promote
      to: promoted
    - from: promoted
      action: deprecate
      to: deprecated
