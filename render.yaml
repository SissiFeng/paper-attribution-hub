services:
  - type: web
    name: paper-attribution-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon

    envVars:
      - key: PAS_DATABASE_URL
        sync: false          # Set manually in Render dashboard from Supabase
      - key: PAS_CORS_ORIGINS
        sync: false          # e.g. ["https://your-app.vercel.app"]
      - key: PAS_OPENALEX_MAILTO
        sync: false
      - key: PAS_SEMANTIC_SCHOLAR_API_KEY
        sync: false

    healthCheckPath: /health
