name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAS_DATABASE_URL: sqlite:////tmp/pas-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Ruff
        run: ruff check backend
      - name: Full backend test suite
        run: pytest -q
        working-directory: backend

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pas
          POSTGRES_USER: pas
          POSTGRES_PASSWORD: pas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pas -d pas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAS_DATABASE_URL: postgresql+psycopg2://pas:pas@localhost:5432/pas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: PostgreSQL migration round trip
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run check:filter
        working-directory: frontend
      - run: npm run check:chat
        working-directory: frontend
      - run: npm run check:transfer
        working-directory: frontend
