name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PAS_DATABASE_URL: sqlite:////tmp/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Backend app import smoke
        timeout-minutes: 2
        run: python -c "from app.main import app; print(app.title)"
        working-directory: backend
      - name: KB SAG GNN tests
        timeout-minutes: 4
        run: >
          pytest -q
          tests/test_kb_service.py
          tests/test_lab_service.py
          tests/test_sag_lite_service.py
          tests/test_graph_ml_dataset_service.py
          tests/test_export_kb_md.py
          tests/test_entity_extractor.py
          tests/test_build_lab_registry.py
        working-directory: backend
      - name: Transfer API tests
        timeout-minutes: 4
        run: >
          pytest -q
          tests/test_api.py
          tests/test_auth.py
          tests/test_transfer_service.py
          tests/test_transfer_designer.py
          tests/test_evolutionary_transfer_service.py
          tests/test_tku_extractor.py
        working-directory: backend
