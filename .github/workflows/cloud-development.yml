name: Cloud development acceptance
on:
  workflow_dispatch:
  push:
    branches: ['cloud/**']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, build and test the portable workspace
        run: bash scripts/cloud/setup.sh
