ization method (GOM) using genetic algorithms (GA), and simulated annealing (SA) model coupled (HYBGASA) with a Gaussian process regression method based emulator (GPMEM)\"\n- (2017): \"Then, the nonlinear GC test based on Gaussian process regression (GPR) is conducted on the isolated process variables to discover the path of fault propagation and find out the root cause of the fault.\"\n- (2017): \"The linear methods PLS and ridge regression (RR) are compared with their kernel (nonlinear) versions, kPLS and kRR, as well as with the (also nonlinear) relevance vector machine (RVM) and Gaussian process regression (GPR).\"\n- (2017): \"To achieve CMPs generalization, refer-ence trajectories (represented in the form of task space position trajectories) are encoded as Dynamic Movement Primitives (DMPs) while the feed-forward torques are learned through the Gaussian Process Regression\"\n- (2017, Property prediction): \"Data gathered from this experimental plan was used to produce a Gaussian process regression (GPR) model in order to estimate unobserved VNS sequences.\"\n- (2017): \"We present a method for model selection between heteroscedastic and standard homoscedastic Gaussian process regression techniques to create suitable surrogate functions from noisy samples, and to find the point to be observed at the next step.\"\n- (2017): \"For this purpose, we use Gaussian Process regression for the feedforward compensation of the unknown dynamics of the system.\"\n- (2017, Property prediction): \"In addition, the adopted Gaussian process regression formulation allows us to predict the underlying uncertainties as a measure of our confidence in the predictions.\"\n- (2018, Property prediction): \"Instead, we seek to predict product quality characteristics using readily available sensor readings of the tool environment during processing of each wafer and employ Gaussian Process Regression (GPR) paradigm to realize this Virtual Metrology (VM) c\"\n\n## Adoption\n\n- Origin: [[wi 022, Property prediction): \"High-throughput predictions of metal–organic framework electronic properties: theoretical challenges, graph neural networks, and data exploration\"\n- (2022, Property prediction): \"We introduce deep neural virtual screening (DENVIS), an end-to-end pipeline for virtual screening using graph neural networks (GNNs).\"\n- (2022, Property prediction): \"Graph Neural Networks (GNNs) have shown great success in many applications such as recommendation systems, molecular property prediction, traffic prediction, etc.\"\n- (2022, Property prediction): \"Empowered by machine learning (ML) algorithms including graph neural networks, not only global properties such as elastic moduli, but also local behaviors such as atomic stress can be predicted and optimized based on their atomic structure, bypassing\"\n- (2022): \"Using graph neural networks for large graphs is challenging since there is no clear way of constructing mini-batches.\"\n- (2022, Property prediction): \"For liquid-phase catalytic applications, emerging DC techniques such as Convolutional and Graph Neural Networks (CNN/GNN), Topological Data Analysis (TDA), and Active Learning (AL) can leverage MD and experimental data to quickly predict solvent effe\"\n- (2022, Optimization): \"Here, we present an efficient optimization algorithm to determine suitable conditions based on BO that is guided by a graph neural network (GNN) trained on a million organic synthesis experiment data.\"\n\n## Adoption\n\n- Origin: [[wiki/labs/aspuru-guzik-lab|Alán Aspuru-Guzik Group]] (2023)\n- [[wiki/labs/hattrick-simpers-lab|Jason Hattrick-Simpers Group]]: first mention 2024 (+1y)\n- [[wiki/labs/seferos-lab|Dwight Seferos Group]]: first mention 2024 (+1y)\n- [[wiki/labs/voznyy-lab|Oleksandr Voznyy Group]]: first mention 2024 (+1y)\n- [[wiki/labs/sanchez-lab|Benjamin Sanchez Group]]: first mention 2025 (+2y)\n- [[wiki/labs/sutton-lab|Chris Sutton Group]]: first mention 2025 (+2y)\n\n## Papers\n\n- Scale-Aware ory Oxide\"\n- (2021, Generative design): \"In particular, ALKEMIE is integrated with a module for the generation of machine-learned interatomic potential for large-scale molecular dynamic simulations where the dataset is obtained from high-throughput first-principles calculations.\"\n- (2022, Property prediction): \"We demonstrate that the MLIP predicted properties compare well with the DFT results on various test cases, and are consistent with the available experimental data.\"\n- (2023): \"Machine learning interatomic potentials have emerged as a powerful tool for bypassing the spatiotemporal limitations of ab initio simulations, but major challenges remain in their efficient parameterization.\"\n- (2023, Automation & orchestration): \"Such high level capabilities to automate machine learning interatomic potential fitting procedures are already incorporated in wfl, which we use to showcase its capabilities in this work.\"\n- (2023): \"We also employ the developed ML interatomic potential in a genetic algorithm for efficient structure search, leading to the discovery of more metastable compounds.\"\n- (2024): \"Machine learning interatomic potentials (MLIPs) enable accurate simulations of materials at scales beyond that accessible by ab initio methods and play an increasingly important role in the study and design of materials.\"\n- (2024): \"In this work, we present an accurate, efficient, and widely applicable machine learning interatomic potential (MLIP) trained on 86 diverse experimentally reported HOIP materials.\"\n- (2024): \"The advent of machine learning interatomic potentials in recent years has ushered in new opportunities for the development of reliable Zn potentials.\"\n- (2024): \"These calculations employed a universal machine-learning interatomic potential (ML-IAP) as a surrogate model for density functional theory (DFT).\"\n- (2024): \"Over the past decade, machine learning interatomic potentials (MLIPs) have advanced many areas of computational materials science and chemistry.\"\n- (2024): \"To provide a point-of-comparison on the performance of atom-centered MLIPs, we also trained the neural equivariant interatomic potential (NequIP) on a subset of our data.\"\n- (2024): \"While state-of-the-art machine learning interatomic potentials only partially capture experimental ordering, descriptors obtained from first-principles simulations correctly rank up to 93% of compositions in an experimental dataset of 190 perovskite\"\n\n## Adoption\n\n- Origin: [[wiki/labs/vegge-lab|Tejs Vegge Group]] (2024)\n- [[wiki/labs/moosavi-lab|Mohamad Moosavi Group]]: first mention 2025 (+1y)\n\n## Papers\n\n- Accelerating high-throughput searches for new alloys with active learning of interatomic potentials (2019) — `ADJACENT`\n- Performance and Cost Assessment of Machine Learning Interatomic Potentials (2020) — `ADJACENT`\n- Experimentally Driven Automated Machine-Learned Interatomic Potential for a Refractory Oxide (2021) — `EXCLUDE`\n- ALKEMIE: An intelligent computational platform for accelerating materials discovery and design (2021) — `ADJACENT`\n- Machine Learning Interatomic Potential for High-Throughput Screening of High-Entropy Alloys (2022) — `ADJACENT`\n- AL4GAP: Active learning workflow for generating DFT-SCAN accurate machine-learning potentials for combinatorial molten salt mixtures (2023) — `ADJACENT`\n- wfl Python toolkit for creating machine learning interatomic potentials and related atomistic simulation workflows (2023) — `ADJACENT`\n- Accelerating materials discovery using integrated deep machine learning approaches (2023) — `ADJACENT`\n- Robust training of machine learning interatomic potentials with dimensionality reduction and stratified sampling (2024) — `ADJACENT`\n- Accurate Crystal Structure Prediction of New 2D Hybrid Organic-Inorganic Perovskites (2024) — `ADJACENT`\n- Development of machine learning interatomic potential for zinc (2024) — `ADJACENT`\n- Machine-learning assisted high-throughput dis hin a multiple sequence alignment (MSA) of protein sequences and distill this information into a low-dimensional latent space\"\n- (2023, Property prediction): \"Through high-throughput screening, UP, and the deep-generative VAE method, PSP relationships that are too complex can be revealed by exploiting the materials’ design space with an emphasis on microstructures.\"\n- (2023, Property prediction): \"According to the validations, the VAE-predicted interfacial configuration demonstrates highly similar shear properties to the reference one, justifying its potential for the microstructure design of composite interface.\"\n- (2023): \"The variational autoencoder (VAE) approach is used to discover the latent factors of variability in the system.\"\n- (2023, Characterization & analysis): \"Pair-Variational Autoencoders for Linking and Cross-Reconstruction of Characterization Data from Complementary Structural Characterization Techniques\"\n- [[wiki/labs/garton-lab|Michael Garton Group]] (2024, Generative design): \"We present a variational autoencoder (ProteinVAE) that can generate synthetic viral vector serotypes without epitopes for pre-existing neutralizing antibodies.\"\n\n## Adoption\n\n- Origin: [[wiki/labs/buonassisi-lab|Tonio Buonassisi Group]] (2020)\n- [[wiki/labs/garton-lab|Michael Garton Group]]: first mention 2024 (+4y)\n- [[wiki/labs/aspuru-guzik-lab|Alán Aspuru-Guzik Group]]: first mention 2025 (+5y)\n- [[wiki/labs/moosavi-lab|Mohamad Moosavi Group]]: first mention 2025 (+5y)\n- [[wiki/labs/wang-lab|Bo Wang Group]]: first mention 2025 (+5y)\n\n## Papers\n\n- Self-Consistent Trajectory Autoencoder: Hierarchical Reinforcement Learning with Trajectory Embeddings (2018) — `ADJACENT`\n- Machine learning generative models for automatic design of multi-material 3D printed composite solids (2020) — `ADJACENT`\n- Detecting Microcracks in Photovoltaics Silicon Wafers using Varitional Autoencoder (2020) — labs: [[wiki/labs/buonassisi-lab|Tonio Buonassisi Group]] — const COLORS = { lab: "#7aa2f7", method: "#bb9af7", material: "#9ece6a",
  instrument: "#e0af68", software: "#2ac3de", concept: "#c0caf5" };
const CAT_PALETTE = ["#bb9af7", "#f7768e", "#ff9e64", "#73daca", "#b4f9f8",
  "#c53b53", "#41a6b5", "#ffc777", "#4fd6be", "#fca7ea"];
const TYPE_LABELS = { lab: "实验室 labs", method: "方法 methods",
  material: "材料 materials", instrument: "仪器 instruments",
  software: "软件 software", concept: "概念 concepts" };

function colorFor(n) {
  if (n.type === "method" && n.category) {
    return CAT_PALETTE[DATA.categories.indexOf(n.category) % CAT_PALETTE.length];
  }
  return COLORS[n.type] || "#888";
}

const byId = {};
DATA.nodes.forEach(n => { byId[n.id] = n; });
const presentTypes = [...new Set(DATA.nodes.map(n => n.type))]
  .sort((a, b) => Object.keys(COLORS).indexOf(a) - Object.keys(COLORS).indexOf(b));
const hasAdoption = DATA.edges.some(e => e.type === "adoption");
const state = { query: "", types: {}, adoption: true };
presentTypes.forEach(t => { state.types[t] = true; });

// type toggles + legend chips
const togglesEl = document.getElementById("toggles");
function addToggle(key, text, color) {
  const label = document.createElement("label");
  const box = document.createElement("input");
  box.type = "checkbox"; box.checked = true;
  box.addEventListener("change", () => {
    if (key === "adoption") state.adoption = box.checked;
    else state.types[key] = box.checked;
    render();
  });
  label.appendChild(box);
  if (color) {
    const chip = document.createElement("span");
    chip.className = "chip"; chip.style.background = color;
    label.appendChild(chip);
  }
  label.appendChild(document.createTextNode(text));
  togglesEl.appendChild(label);
}
presentTypes.forEach(t => addToggle(t, TYPE_LABELS[t] || t, COLORS[t]));
if (hasAdoption) addToggle("adoption", "采纳 adoption edges", "#f7768e");

function visible() {
  const nodes = DATA.nodes.filter(n => state.types[n.type]);
  const ids = new Set(nodes.map(n => n.id));
  const edges = DATA.edges.filter(e => ids.has(e.source) && ids.has(e.target)
    && (e.type !== "adoption" || state.adoption));
  return { nodes, edges };
}

function edgeStyle(e) {
  if (e.type === "adoption") return { type: "dashed", color: "#f7768e",
    width: 1.6, opacity: 0.85, curveness: 0.25 };
  if (e.type === "collab") return { color: "#7aa2f7",
    width: Math.min(1 + e.weight / 2, 4), opacity: 0.5, curveness: 0.1 };
  if (e.type === "member") return { color: "#565f89", width: 1, opacity: 0.5, curveness: 0.1 };
  return { color: "#3b4261", width: Math.min(0.5 + e.weight / 2, 3),
    opacity: 0.45, curveness: 0.05 };
}

function buildOption() {
  const { nodes, edges } = visible();
  const q = state.query.trim().toLowerCase();
  const match = n => !q || n.label.toLowerCase().includes(q);
  return {
    backgroundColor: "transparent",
    tooltip: {
      backgroundColor: "#181825", borderColor: "#313244", textStyle: { color: "#c0caf5" },
      formatter: p => {
        if (p.dataType === "edge") {
          const e = p.data.raw;
          return e.type + (e.entity ? ": " + e.entity : "") + (e.weight > 1 ? " (" + e.weight + ")" : "");
        }
        const n = p.data.raw;
        return "<b>" + n.label + "</b><br>" + n.type +
          (n.category ? " · " + n.category : "") +
          (n.papers != null ? " · " + n.papers + " papers" : "");
      },
    },
    series: [{
      type: "graph", layout: "force", roam: true,
      force: { repulsion: 140, gravity: 0.12, edgeLength: [40, 160], friction: 0.15 },
      scaleLimit: { min: 0.3, max: 12 },
      emphasis: { focus: "adjacency", label: { show: true } },
      label: { color: "#c0caf5", fontSize: 10, position: "right" },
      lineStyle: { curveness: 0.05 },
      data: nodes.map(n => ({
        id: n.id, name: n.label, symbolSize: n.size, raw: n,
        itemStyle: { color: colorFor(n), shadowBlur: 14, shadowColor: colorFor(n),
          opacity: match(n) ? 1 : 0.07 },
        label: { show: match(n) && (n.type === "lab" || n.type === "concept" || !!q) },
      })),
      edges: edges.map(e => ({ source: e.source, target: e.target, raw: e,
        lineStyle: edgeStyle(e) })),
    }],
  };
}

// side panel: render the node's wiki page; wikilinks resolve to graph nodes
const panel = document.getElementById("panel");
const panelBody = document.getElementById("panel-body");
function mdToHtml(md) {
  md = md.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,
        (m, p, t) => '<a class="wl" data-id="' + p + '">' + t + "</a>")
      .replace(/\[\[([^\]]+)\]\]/g,
        (m, p) => '<a class="wl" data-id="' + p + '">' + p + "</a>");
  if (window.marked) return marked.parse(md);
  const pre = document.createElement("pre");
  pre.textContent = md;
  return pre.outerHTML;
}
function openPanel(node) {
  document.getElementById("panel-title").textContent = node.label;
  document.getElementById("panel-type").textContent =
    node.type + (node.category ? " · " + node.category : "");
  panelBody.innerHTML = mdToHtml(node.md || "*No page body.*");
  panel.classList.add("open");
  panelBody.scrollTop = 0;
  if (window.chart) chart.resize();
}
document.getElementById("panel-close").addEventListener("click", () => {
  panel.classList.remove("open");
  if (window.chart) chart.resize();
});
panelBody.addEventListener("click", ev => {
  const a = ev.target.closest("a.wl");
  if (!a) return;
  ev.preventDefault();
  focusNode(a.dataset.id);
});
function focusNode(id) {
  const node = byId[id];
  if (!node) return;
  if (!state.types[node.type]) {
    state.types[node.type] = true;
    [...togglesEl.querySelectorAll("label")].forEach(l => {
      if (l.textContent === (TYPE_LABELS[node.type] || node.type)) {
        l.querySelector("input").checked = true;
      }
    });
    render();
  }
  openPanel(node);
  if (window.chart) {
    const idx = visible().nodes.findIndex(n => n.id === id);
    if (idx >= 0) {
      chart.dispatchAction({ type: "downplay", seriesIndex: 0 });
      chart.dispatchAction({ type: "highlight", seriesIndex: 0, dataIndex: idx });
    }
  }
}

function render() {
  const { nodes, edges } = visible();
  document.getElementById("stats").textContent =
    nodes.length + " 节点 nodes · " + edges.length + " 边 edges · generated " + DATA.generated;
  if (window.chart) chart.setOption(buildOption(), { notMerge: true });
}

document.getElementById("search").addEventListener("input", ev => {
  state.query = ev.target.value;
  render();
});

if (typeof echarts === "undefined") {
  document.getElementById("chart").innerHTML =
    '<div class="fallback"><b>图表库加载失败 / chart library unavailable.</b><br><br>' +
    "ECharts is loaded from a CDN; offline it cannot render. The data is still " +
    "here: " + DATA.nodes.length + " nodes / " + DATA.edges.length + " edges — see " +
    "<code>graph.json</code> and the Markdown pages under <code>wiki/</code>.</div>";
  render();
} else {
  window.chart = echarts.init(document.getElementById("chart"), null, { renderer: "canvas" });
  chart.on("click", p => { if (p.dataType === "node") openPanel(p.data.raw); });
  window.addEventListener("resize", () => chart.resize());
  render();
}
</script>
</body>
